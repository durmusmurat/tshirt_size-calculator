<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>T-Shirt Size Calculator</title>

<style>

/* =====================================================
   DESIGN SYSTEM
===================================================== */

:root {
    --red: #e60000;
    --red-dark: #bd0000;
    --red-soft: #fff1f1;
    --dark: #242424;
    --text: #333333;
    --muted: #707070;
    --line: #e6e6e6;
    --bg: #f4f5f6;
    --white: #ffffff;
    --green: #2e7d32;
    --orange: #ed6c02;
}


/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {
    padding: 14px;
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
}


/* =====================================================
   APP
===================================================== */

.app {
    width: min(1450px, calc(100vw - 28px));
    margin: auto;
}


/* =====================================================
   HEADER
===================================================== */

.header {
    padding: 15px 22px;
    border-radius: 18px 18px 0 0;

    background:
        linear-gradient(
            125deg,
            #e60000,
            #c70000
        );

    color: white;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 20px;
}


.brand-area {
    display: flex;
    align-items: center;
    gap: 14px;
}


/* =====================================================
   VODAFONE LOGO
===================================================== */

.brand-mark {
    width: 48px;
    height: 48px;

    display: flex;
    align-items: center;
    justify-content: center;

    flex-shrink: 0;
}


.brand-mark img {
    width: 48px;
    height: 48px;

    display: block;

    object-fit: contain;
}


/* =====================================================
   HEADER TEXT
===================================================== */

.header h1 {
    margin: 0;
    font-size: 25px;
}


.header p {
    margin: 4px 0 0;

    color: #ffe4e4;

    font-size: 13px;
}


.header-progress {
    text-align: right;
    white-space: nowrap;
}


.header-progress small {
    display: block;

    margin-bottom: 3px;

    font-size: 10px;

    opacity: .8;

    letter-spacing: 1px;

    text-transform: uppercase;
}


.header-progress strong {
    font-size: 21px;
}


/* =====================================================
   MAIN CARD
===================================================== */

.card {
    overflow: hidden;

    background: white;

    border-radius: 0 0 18px 18px;

    box-shadow:
        0 10px 30px
        rgba(0, 0, 0, .08);
}


/* =====================================================
   MATRIX HEADER
===================================================== */

.matrix-header {
    display: grid;

    grid-template-columns:
        205px
        repeat(4, 1fr);

    background: #fafafa;

    border-bottom:
        1px solid var(--line);
}


.matrix-header div {
    padding: 8px 10px;

    text-align: center;

    font-size: 12px;

    font-weight: 700;

    color: #777;
}


.matrix-header div:first-child {
    text-align: left;
}


.matrix-header .score-header {
    color: var(--red);

    font-size: 17px;
}


/* =====================================================
   QUESTION ROW
===================================================== */

.question {
    display: grid;

    grid-template-columns:
        205px
        repeat(4, 1fr);

    border-bottom:
        1px solid var(--line);
}


.question-title {
    padding: 7px 11px;

    background: #fcfcfc;

    display: flex;
    align-items: center;

    gap: 8px;
}


.question-index {
    font-size: 10px;

    font-weight: 800;

    color: var(--red);
}


.question-label {
    font-size: 14px;

    font-weight: 700;

    line-height: 1.2;
}


/* =====================================================
   OPTION
===================================================== */

.option {
    position: relative;

    min-height: 57px;

    padding: 7px 10px;

    border: 0;

    border-left:
        1px solid #eeeeee;

    background: white;

    color: #444;

    cursor: pointer;

    text-align: left;

    font-size: 13px;

    line-height: 1.22;

    display: flex;

    align-items: center;

    transition:
        background .15s ease,
        color .15s ease,
        transform .15s ease,
        box-shadow .15s ease;
}


.option:hover {
    background: var(--red-soft);
}


.option.selected {
    z-index: 2;

    background: var(--red);

    color: white;

    font-weight: 600;

    box-shadow:
        inset 0 0 0 1px
        rgba(255, 255, 255, .2);
}


.option.selected::before {
    content: "✓";

    width: 22px;
    height: 22px;

    min-width: 22px;

    margin-right: 7px;

    border-radius: 50%;

    display: grid;

    place-items: center;

    background: white;

    color: var(--red);

    font-size: 12px;

    font-weight: 900;
}


/* =====================================================
   COCKPIT
===================================================== */

.cockpit {
    padding: 11px 18px;

    display: grid;

    grid-template-columns:
        auto auto auto 1fr auto;

    gap: 22px;

    align-items: center;

    background:
        linear-gradient(
            90deg,
            #fafafa,
            #f4f4f4
        );

    border-top:
        1px solid var(--line);
}


/* =====================================================
   METRIC
===================================================== */

.metric small {
    display: block;

    margin-bottom: 3px;

    color: #777;

    font-size: 10px;

    letter-spacing: .8px;

    text-transform: uppercase;
}


.metric strong {
    font-size: 23px;
}


/* =====================================================
   SIZE BADGE
===================================================== */

.size-box {
    min-width: 130px;

    padding: 10px 16px;

    border-radius: 11px;

    text-align: center;

    background: #999;

    color: white;

    font-size: 19px;

    font-weight: 800;

    transition:
        background .25s ease,
        transform .25s ease;
}


.size-box.small {
    background: var(--green);
}


.size-box.medium {
    background: #1976d2;
}


.size-box.large {
    background: var(--orange);
}


.size-box.xlarge {
    background: var(--red);
}


.size-box.changed {
    animation:
        resultPop .25s ease;
}


@keyframes resultPop {

    0% {
        transform: scale(.92);
    }

    70% {
        transform: scale(1.05);
    }

    100% {
        transform: scale(1);
    }

}


/* =====================================================
   DISTRIBUTION
===================================================== */

.distribution {
    display: flex;

    justify-content: center;

    gap: 6px;
}


.dist-item {
    min-width: 44px;

    padding: 5px 7px;

    border:
        1px solid #ddd;

    border-radius: 8px;

    background: white;

    text-align: center;
}


.dist-item span {
    display: block;

    color: #888;

    font-size: 9px;
}


.dist-item strong {
    font-size: 14px;
}


.dist-zero {
    color: #aaa;
}


/* =====================================================
   ACTIONS
===================================================== */

.actions {
    display: flex;

    gap: 7px;
}


.action {
    padding: 9px 13px;

    border: 0;

    border-radius: 8px;

    cursor: pointer;

    font-size: 12px;

    font-weight: 700;

    white-space: nowrap;
}


.reset {
    background: white;

    border:
        1px solid #ccc;

    color: #444;
}


.reset:hover {
    background: #f2f2f2;
}


.copy {
    background: var(--dark);

    color: white;
}


.copy:hover {
    background: black;
}


/* =====================================================
   SCALE
===================================================== */

.scale-area {
    padding: 6px 16px;

    display: flex;

    justify-content: center;

    gap: 18px;

    border-top:
        1px solid var(--line);

    background: white;

    font-size: 10px;

    color: #777;
}


.scale-area b {
    color: #333;
}


/* =====================================================
   SUMMARY HEADER
===================================================== */

.summary-toggle {
    width: 100%;

    padding: 9px 17px;

    border: 0;

    border-top:
        1px solid var(--line);

    background: #fafafa;

    cursor: pointer;

    display: flex;

    justify-content: space-between;

    align-items: center;

    font-size: 12px;

    color: #444;
}


.summary-toggle strong {
    font-size: 12px;
}


.summary-toggle:hover {
    background: #f4f4f4;
}


.summary-arrow {
    display: inline-block;

    transition:
        transform .2s ease;
}


.summary-open .summary-arrow {
    transform:
        rotate(180deg);
}


/* =====================================================
   SUMMARY PANEL
===================================================== */

.summary {
    display: none;

    border-top:
        1px solid var(--line);

    background: white;
}


.summary.visible {
    display: block;
}


/* =====================================================
   SUMMARY TABLE
===================================================== */

.summary-row {
    display: grid;

    grid-template-columns:
        220px 60px 1fr;

    align-items: center;

    min-height: 37px;

    border-bottom:
        1px solid #eeeeee;
}


.summary-row:last-child {
    border-bottom: none;
}


.summary-row > div {
    padding: 7px 13px;
}


.summary-name {
    font-size: 12px;

    font-weight: 700;
}


.summary-score {
    text-align: center;
}


.score-pill {
    display: inline-grid;

    width: 27px;
    height: 27px;

    place-items: center;

    border-radius: 50%;

    background: var(--red);

    color: white;

    font-size: 12px;

    font-weight: 800;
}


.score-pill.zero {
    background: #ededed;

    color: #888;
}


.summary-answer {
    font-size: 12px;

    color: #555;
}


.summary-answer.empty {
    color: #aaa;

    font-style: italic;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 900px) {

    body {
        padding: 0;
    }


    .app {
        width: 100%;
    }


    .header,
    .card {
        border-radius: 0;
    }


    .matrix-header {
        display: none;
    }


    .question {
        display: block;

        padding: 6px;
    }


    .question-title {
        padding: 8px;
    }


    .option {
        display: inline-flex;

        vertical-align: top;

        width:
            calc(50% - 4px);

        min-height: 64px;

        margin: 2px;

        border:
            1px solid #eee;

        border-radius: 7px;
    }


    .cockpit {
        grid-template-columns:
            1fr 1fr;
    }


    .distribution {
        justify-content: flex-start;
    }


    .actions {
        grid-column:
            1 / -1;
    }


    .action {
        flex: 1;
    }


    .scale-area {
        flex-wrap: wrap;
    }


    .summary-row {
        grid-template-columns:
            150px 50px 1fr;
    }

}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media (max-width: 520px) {

    .brand-mark {
        display: none;
    }


    .header {
        padding: 13px;
    }


    .header h1 {
        font-size: 20px;
    }


    .header p {
        font-size: 11px;
    }


    .header-progress small {
        display: none;
    }


    .option {
        width:
            calc(100% - 4px);

        min-height: 49px;
    }


    .cockpit {
        gap: 12px;
    }


    .distribution {
        grid-column:
            1 / -1;
    }


    .summary-row {
        grid-template-columns:
            1fr 45px;
    }


    .summary-answer {
        grid-column:
            1 / -1;

        padding-top:
            0 !important;
    }

}

</style>

</head>


<body>

<div class="app">


<!-- ===================================================
     HEADER
=================================================== -->

<header class="header">


    <div class="brand-area">


        <div class="brand-mark">

            <img
                src="vodafone-logo.png"
                alt="Vodafone"
            >

        </div>


        <div>

            <h1>
                T-Shirt Size Calculator
            </h1>

            <p>
                Complexity · Scope · Risk · Impact · Coordination
            </p>

        </div>


    </div>


    <div class="header-progress">

        <small>
            Değerlendirilen kriter
        </small>

        <strong id="selectedCount">
            0 / 8
        </strong>

    </div>


</header>



<!-- ===================================================
     CARD
=================================================== -->

<main class="card">


<!-- MATRIX HEADER -->

<div class="matrix-header">

    <div>
        Kriter
    </div>

    <div class="score-header">
        1
    </div>

    <div class="score-header">
        2
    </div>

    <div class="score-header">
        3
    </div>

    <div class="score-header">
        4
    </div>

</div>



<!-- QUESTIONS -->

<div id="questions"></div>



<!-- ===================================================
     ESTIMATION COCKPIT
=================================================== -->

<div class="cockpit">


    <div class="metric">

        <small>
            Toplam
        </small>

        <strong id="totalScore">
            0
        </strong>

    </div>



    <div class="metric">

        <small>
            Average
        </small>

        <strong id="averageScore">
            0.00
        </strong>

    </div>



    <div
        id="sizeResult"
        class="size-box"
    >
        No Size
    </div>



    <div
        class="distribution"
        title="Seçilen puanların dağılımı"
    >


        <div class="dist-item">

            <span>
                SCORE 1
            </span>

            <strong id="dist1">
                0
            </strong>

        </div>


        <div class="dist-item">

            <span>
                SCORE 2
            </span>

            <strong id="dist2">
                0
            </strong>

        </div>


        <div class="dist-item">

            <span>
                SCORE 3
            </span>

            <strong id="dist3">
                0
            </strong>

        </div>


        <div class="dist-item">

            <span>
                SCORE 4
            </span>

            <strong id="dist4">
                0
            </strong>

        </div>


        <div class="dist-item">

            <span>
                EMPTY
            </span>

            <strong
                id="dist0"
                class="dist-zero"
            >
                8
            </strong>

        </div>


    </div>



    <div class="actions">


        <button
            type="button"
            class="action reset"
            onclick="resetCalculator()"
        >
            ↻ Sıfırla
        </button>


        <button
            type="button"
            id="copyButton"
            class="action copy"
            onclick="copyForJira()"
        >
            Jira'ya Kopyala
        </button>


    </div>


</div>



<!-- ===================================================
     SCALE
=================================================== -->

<div class="scale-area">

    <b>
        T-Shirt Size
    </b>

    <span>
        1.00–1.75 Small
    </span>

    <span>
        1.76–2.50 Medium
    </span>

    <span>
        2.51–3.25 Large
    </span>

    <span>
        3.26–4.00 X-Large
    </span>

</div>



<!-- ===================================================
     SUMMARY TOGGLE
=================================================== -->

<button
    type="button"
    id="summaryToggle"
    class="summary-toggle"
    onclick="toggleSummary()"
>

    <strong>
        ☰ Seçimlerin Özeti
    </strong>

    <span>

        <span id="summaryMessage">
            Henüz seçim yapılmadı
        </span>

        &nbsp;

        <span class="summary-arrow">
            ▼
        </span>

    </span>

</button>



<!-- ===================================================
     SUMMARY
=================================================== -->

<div
    id="summary"
    class="summary"
></div>


</main>

</div>



<script>

/* =====================================================
   DATA MODEL
===================================================== */

const criteria = [

    {
        name: "Veri Karmaşıklığı",

        options: [
            "Veri Hazır",
            "Küçük veri hazırlığı",
            "Birden fazla kaynak",
            "Veri keşfi / veri kalitesi problemi"
        ]
    },

    {
        name: "İşin Kapsamı",

        options: [
            "Tek ve net bir ihtiyacı çözer",
            "Birden fazla alt aktivite içerir",
            "Bir iş akışının veya önemli bir yeteneğin geliştirilmesi",
            "Birden fazla iş alanını kapsar veya parçalanması düşünülmelidir"
        ]
    },

    {
        name: "Çözüm Karmaşıklığı",

        options: [
            "Bilinen çözüm paterni",
            "Kısmen analiz ve tasarım gerektirir",
            "Birden fazla teknik karar içerir",
            "Yüksek teknik ve iş karmaşıklığı"
        ]
    },

    {
        name: "Bağımlılık Seviyesi",

        options: [
            "Bağımlılık yok veya çok sınırlı",
            "Tek ekip, sistem veya vendor bağımlılığı",
            "Birden fazla ekip/sistem veya kritik vendor bağımlılığı",
            "Çok sayıda ekip, sistem ve/veya kritik vendor bağımlılığı vardır"
        ]
    },

    {
        name: "Risk & Belirsizlik",

        options: [
            "Çözüm ve ihtiyaç net",
            "Bazı bilinmezler bulunur",
            "Risk veya belirsizlik yüksektir",
            "Belirsizlik ve risk kritik seviyededir"
        ]
    },

    {
        name: "Etki Alanı",

        options: [
            "Tek sistem / tek domain",
            "Birden fazla bileşeni etkiler",
            "Birden fazla ürün / domain etkilenir",
            "Tribe genelinde veya geniş ekosistemde etki yaratır"
        ]
    },

    {
        name: "Paydaş / Koordinasyon İhtiyacı",

        options: [
            "Az sayıda paydaş",
            "Birkaç paydaş ile koordinasyon gerekir",
            "Düzenli koordinasyon gerekir",
            "Yoğun koordinasyon ve hizalanma gerekir"
        ]
    },

    {
        name: "Uzmanlık Çeşitliliği",

        options: [
            "Tek uzmanlık alanı",
            "2-3 uzmanlık alanı",
            "4 farklı uzmanlık alanı",
            "Dörtten fazla uzmanlık alanı ve paralel koordinasyon"
        ]
    }

];


/* =====================================================
   ANSWERS
   Boş satır = 0
===================================================== */

const answers =
    new Array(criteria.length).fill(0);


/* =====================================================
   CREATE MATRIX
===================================================== */

const questionsContainer =
    document.getElementById("questions");


criteria.forEach(
    (criterion, rowIndex) => {


        const row =
            document.createElement("div");


        row.className =
            "question";


        const title =
            document.createElement("div");


        title.className =
            "question-title";


        title.innerHTML = `

            <span class="question-index">

                ${String(rowIndex + 1).padStart(2, "0")}

            </span>

            <span class="question-label">

                ${criterion.name}

            </span>

        `;


        row.appendChild(title);


        criterion.options.forEach(
            (optionText, optionIndex) => {


                const score =
                    optionIndex + 1;


                const button =
                    document.createElement("button");


                button.type =
                    "button";


                button.className =
                    "option";


                button.dataset.row =
                    rowIndex;


                button.dataset.score =
                    score;


                button.textContent =
                    optionText;


                button.onclick =
                    function () {


                        selectOption(
                            rowIndex,
                            score,
                            button
                        );


                    };


                row.appendChild(button);

            }
        );


        questionsContainer.appendChild(row);

    }
);


/* =====================================================
   CREATE SUMMARY
===================================================== */

function buildSummary() {


    const summary =
        document.getElementById("summary");


    summary.innerHTML = "";


    criteria.forEach(
        (criterion, index) => {


            const score =
                answers[index];


            const row =
                document.createElement("div");


            row.className =
                "summary-row";


            const description =
                score === 0
                    ? "Boş bırakıldı"
                    : criterion.options[score - 1];


            row.innerHTML = `

                <div class="summary-name">

                    ${criterion.name}

                </div>


                <div class="summary-score">

                    <span
                        class="score-pill ${score === 0 ? "zero" : ""}"
                    >

                        ${score}

                    </span>

                </div>


                <div
                    class="summary-answer ${score === 0 ? "empty" : ""}"
                >

                    ${description}

                </div>

            `;


            summary.appendChild(row);

        }
    );

}


/* =====================================================
   SELECT OPTION
===================================================== */

function selectOption(
    rowIndex,
    score,
    selectedButton
) {


    /* Aynı seçeneğe tekrar basılırsa temizle */

    if (
        answers[rowIndex] === score
        &&
        selectedButton.classList.contains("selected")
    ) {


        answers[rowIndex] = 0;


        selectedButton
            .classList
            .remove("selected");


        calculate();


        return;

    }


    /* Aynı satırdaki eski seçimi kaldır */

    document
        .querySelectorAll(
            `[data-row="${rowIndex}"]`
        )
        .forEach(
            button => {


                button
                    .classList
                    .remove("selected");


            }
        );


    /* Yeni seçimi kaydet */

    answers[rowIndex] =
        score;


    selectedButton
        .classList
        .add("selected");


    calculate();

}


/* =====================================================
   SIZE CALCULATION
===================================================== */

function calculateSize(average) {


    if (
        average >= 1.00
        &&
        average <= 1.75
    ) {

        return "Small";

    }


    if (
        average > 1.75
        &&
        average <= 2.50
    ) {

        return "Medium";

    }


    if (
        average > 2.50
        &&
        average <= 3.25
    ) {

        return "Large";

    }


    if (
        average > 3.25
        &&
        average <= 4.00
    ) {

        return "X-Large";

    }


    return "No Size";

}


/* =====================================================
   SIZE STYLE
===================================================== */

function updateSizeStyle(
    sizeElement,
    size
) {


    sizeElement.classList.remove(
        "small",
        "medium",
        "large",
        "xlarge",
        "changed"
    );


    if (size === "Small") {

        sizeElement
            .classList
            .add("small");

    }


    else if (size === "Medium") {

        sizeElement
            .classList
            .add("medium");

    }


    else if (size === "Large") {

        sizeElement
            .classList
            .add("large");

    }


    else if (size === "X-Large") {

        sizeElement
            .classList
            .add("xlarge");

    }


    /*
       Animasyonu yeniden başlat.
    */

    void sizeElement.offsetWidth;


    sizeElement
        .classList
        .add("changed");

}


/* =====================================================
   MAIN CALCULATION
===================================================== */

function calculate() {


    /*
       Toplam puan.
    */

    const total =
        answers.reduce(
            (sum, current) =>
                sum + current,
            0
        );


    /*
       Boş kriterler 0 kabul edilir.

       Bu nedenle her zaman
       kriter sayısına, yani 8'e bölünür.
    */

    const average =
        total / criteria.length;


    /*
       Kaç kriter seçilmiş?
    */

    const selectedCount =
        answers.filter(
            score =>
                score !== 0
        ).length;


    /*
       Size hesapla.
    */

    const size =
        calculateSize(average);


    /*
       Ekrandaki değerleri güncelle.
    */

    document
        .getElementById("totalScore")
        .textContent =
        total;


    document
        .getElementById("averageScore")
        .textContent =
        average.toFixed(2);


    document
        .getElementById("selectedCount")
        .textContent =
        `${selectedCount} / ${criteria.length}`;


    /*
       Size sonucu.
    */

    const sizeElement =
        document.getElementById("sizeResult");


    sizeElement.textContent =
        size;


    updateSizeStyle(
        sizeElement,
        size
    );


    /*
       Summary mesajı.
    */

    document
        .getElementById("summaryMessage")
        .textContent =

        selectedCount === 0

            ? "Henüz seçim yapılmadı"

            : `${selectedCount} kriter seçildi`;


    /*
       Diğer alanları güncelle.
    */

    updateDistribution();

    buildSummary();

}


/* =====================================================
   SCORE DISTRIBUTION
===================================================== */

function updateDistribution() {


    for (
        let score = 0;
        score <= 4;
        score++
    ) {


        const count =
            answers.filter(
                value =>
                    value === score
            ).length;


        document
            .getElementById(
                "dist" + score
            )
            .textContent =
            count;

    }

}


/* =====================================================
   SUMMARY OPEN / CLOSE
===================================================== */

function toggleSummary() {


    const summary =
        document.getElementById("summary");


    const button =
        document.getElementById("summaryToggle");


    summary
        .classList
        .toggle("visible");


    button
        .classList
        .toggle("summary-open");

}


/* =====================================================
   RESET
===================================================== */

function resetCalculator() {


    /*
       Tüm değerleri sıfırla.
    */

    answers.fill(0);


    /*
       Tüm seçili hücreleri temizle.
    */

    document
        .querySelectorAll(".option")
        .forEach(
            button => {


                button
                    .classList
                    .remove("selected");


            }
        );


    calculate();

}


/* =====================================================
   COPY FOR JIRA
===================================================== */

async function copyForJira() {


    const total =
        answers.reduce(
            (sum, value) =>
                sum + value,
            0
        );


    const average =
        total / criteria.length;


    const size =
        calculateSize(average);


    let text =
`T-Shirt Size: ${size}
Average Score: ${average.toFixed(2)}
Total Score: ${total}

Estimation Breakdown
--------------------
`;


    criteria.forEach(
        (criterion, index) => {


            const score =
                answers[index];


            if (score === 0) {


                text +=
`${criterion.name}: 0 - Boş bırakıldı
`;


            }


            else {


                text +=
`${criterion.name}: ${score} - ${criterion.options[score - 1]}
`;


            }

        }
    );


    try {


        await navigator
            .clipboard
            .writeText(text);


        const button =
            document.getElementById("copyButton");


        const oldText =
            button.textContent;


        button.textContent =
            "✓ Kopyalandı";


        setTimeout(
            () => {


                button.textContent =
                    oldText;


            },
            1400
        );


    }


    catch (error) {


        alert(
            "Clipboard erişimi sağlanamadı."
        );


    }

}


/* =====================================================
   INITIAL LOAD
===================================================== */

calculate();

</script>
