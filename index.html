<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    T-Shirt Size Calculator
</title>


<style>

/* =====================================================
   COLORS
===================================================== */

:root {

    --vodafone-red: #e60000;
    --vodafone-dark-red: #bd0000;

    --dark: #242424;
    --text: #333333;
    --muted: #6b6b6b;

    --line: #e5e5e5;
    --bg: #f5f5f5;
    --white: #ffffff;

}


/* =====================================================
   GENERAL
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    min-height: 100%;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color: var(--text);

    background: var(--bg);

}

body {

    padding: 14px;

}


/* =====================================================
   MAIN APP
===================================================== */

.app {

    width: min(
        1450px,
        calc(100vw - 28px)
    );

    margin: 0 auto;

}


/* =====================================================
   HEADER
===================================================== */

.header {

    background:
        linear-gradient(
            120deg,
            var(--vodafone-red),
            var(--vodafone-dark-red)
        );

    color: white;

    border-radius:
        18px 18px 0 0;

    padding: 15px 22px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 20px;

}


.header-left {

    display: flex;

    align-items: center;

    gap: 15px;

}


.logo {

    width: 40px;

    height: 40px;

    border:
        3px solid white;

    border-radius: 50%;

    display: grid;

    place-items: center;

    font-size: 29px;

    font-weight: bold;

    line-height: 1;

    flex-shrink: 0;

}


.header h1 {

    margin: 0;

    font-size: 26px;

    line-height: 1.1;

}


.header p {

    margin:
        5px 0 0;

    font-size: 14px;

    line-height: 1.25;

    color: #ffe4e4;

}


.score-header {

    text-align: right;

    white-space: nowrap;

}


.score-header small {

    display: block;

    opacity: .85;

    font-size: 11px;

    text-transform: uppercase;

    letter-spacing: 1px;

    margin-bottom: 3px;

}


.score-header strong {

    font-size: 22px;

}


/* =====================================================
   MAIN CARD
===================================================== */

.card {

    background: white;

    border-radius:
        0 0 18px 18px;

    box-shadow:
        0 10px 30px
        rgba(0, 0, 0, .08);

    overflow: hidden;

}


/* =====================================================
   TABLE HEADER
===================================================== */

.table-header {

    display: grid;

    grid-template-columns:
        205px
        repeat(4, 1fr);

    background:
        #fafafa;

    border-bottom:
        1px solid var(--line);

}


.table-header > div {

    padding:
        8px 10px;

    text-align: center;

    font-size: 13px;

    font-weight: 700;

    color: #777;

}


.table-header > div:first-child {

    text-align: left;

}


.table-header .number {

    color:
        var(--vodafone-red);

    font-size: 17px;

}


/* =====================================================
   QUESTION ROW
===================================================== */

.question {

    display: grid;

    grid-template-columns:
        205px
        repeat(4, 1fr);

    border-bottom:
        1px solid var(--line);

    align-items: stretch;

}


.question:last-child {

    border-bottom: none;

}


/* =====================================================
   QUESTION TITLE
===================================================== */

.question-title {

    padding:
        7px 11px;

    display: flex;

    align-items: center;

    gap: 8px;

    background:
        #fcfcfc;

}


.question-number {

    color:
        var(--vodafone-red);

    font-size: 11px;

    font-weight: 800;

    flex-shrink: 0;

}


.question-name {

    font-size: 14px;

    font-weight: 700;

    line-height: 1.2;

}


/* =====================================================
   OPTIONS
===================================================== */

.option {

    border: 0;

    border-left:
        1px solid #eeeeee;

    background: white;

    padding:
        7px 10px;

    min-height: 58px;

    cursor: pointer;

    display: flex;

    align-items: center;

    font-size: 13px;

    line-height: 1.22;

    text-align: left;

    color: #444;

    transition:
        background .12s ease,
        color .12s ease,
        box-shadow .12s ease;

}


.option:hover {

    background:
        #fff2f2;

}


.option.selected {

    background:
        var(--vodafone-red);

    color: white;

    font-weight: 600;

}


.option.selected::before {

    content: "✓";

    min-width: 22px;

    width: 22px;

    height: 22px;

    margin-right: 7px;

    display: grid;

    place-items: center;

    border-radius: 50%;

    background: white;

    color:
        var(--vodafone-red);

    font-size: 12px;

    font-weight: 900;

    flex-shrink: 0;

}


/* =====================================================
   RESULT AREA
===================================================== */

.result-area {

    background:
        #f7f7f7;

    border-top:
        1px solid var(--line);

    padding:
        11px 18px;

    display: grid;

    grid-template-columns:
        auto
        auto
        1fr
        auto;

    align-items: center;

    gap: 24px;

}


/* =====================================================
   METRICS
===================================================== */

.metric small {

    display: block;

    color: #777;

    font-size: 11px;

    text-transform: uppercase;

    letter-spacing: .8px;

    margin-bottom: 2px;

}


.metric strong {

    font-size: 23px;

}


/* =====================================================
   SIZE RESULT
===================================================== */

.size-result {

    min-width: 145px;

    max-width: 200px;

    padding:
        10px 18px;

    text-align: center;

    border-radius: 10px;

    background:
        var(--vodafone-red);

    color: white;

    font-size: 20px;

    font-weight: 800;

    box-shadow:
        0 3px 8px
        rgba(230, 0, 0, .15);

}


/* =====================================================
   ACTION BUTTONS
===================================================== */

.actions {

    display: flex;

    gap: 8px;

}


button.action {

    border-radius: 8px;

    border: 0;

    padding:
        10px 15px;

    font-size: 13px;

    font-weight: 700;

    cursor: pointer;

    white-space: nowrap;

}


.reset {

    border:
        1px solid #ccc !important;

    background: white;

    color: #444;

}


.reset:hover {

    background:
        #f1f1f1;

}


.copy {

    background:
        var(--dark);

    color: white;

}


.copy:hover {

    background:
        #000000;

}


/* =====================================================
   SIZE SCALE
===================================================== */

.scale {

    padding:
        7px 16px;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 18px;

    background: white;

    border-top:
        1px solid var(--line);

    font-size: 11px;

    color: #777;

}


.scale b {

    color: #444;

}


/* =====================================================
   TABLET / MOBILE
===================================================== */

@media (
    max-width: 900px
) {

    body {

        padding: 0;

    }


    .app {

        width: 100%;

    }


    .header {

        border-radius: 0;

    }


    .card {

        border-radius: 0;

    }


    .table-header {

        display: none;

    }


    .question {

        display: block;

        padding: 6px;

    }


    .question-title {

        padding: 8px;

    }


    .option {

        display: inline-flex;

        width:
            calc(50% - 4px);

        min-height: 62px;

        vertical-align: top;

        border:
            1px solid #eee;

        margin: 2px;

        border-radius: 7px;

        font-size: 13px;

    }


    .result-area {

        grid-template-columns:
            1fr 1fr;

    }


    .actions {

        grid-column:
            1 / -1;

    }


    button.action {

        flex: 1;

    }


    .scale {

        flex-wrap: wrap;

    }

}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media (
    max-width: 520px
) {

    .header {

        padding:
            14px;

    }


    .header h1 {

        font-size: 21px;

    }


    .header p {

        font-size: 12px;

    }


    .logo {

        display: none;

    }


    .score-header small {

        display: none;

    }


    .score-header strong {

        font-size: 17px;

    }


    .option {

        width:
            calc(100% - 4px);

        min-height: 48px;

    }


    .result-area {

        gap: 12px;

    }


    .size-result {

        font-size: 17px;

        min-width: 110px;

    }


    .actions {

        flex-direction: column;

    }

}

</style>

</head>


<body>


<div class="app">


    <!-- ===============================================
         HEADER
    ================================================ -->

    <header class="header">


        <div class="header-left">


            <div class="logo">
                ’
            </div>


            <div>

                <h1>
                    T-Shirt Size Calculator
                </h1>


                <p>
                    Her satırdan işi en iyi tanımlayan
                    seçeneği seç. Boş bırakılan kriter
                    0 puan olarak hesaplanır.
                </p>

            </div>


        </div>


        <div class="score-header">

            <small>
                Seçilen kriter
            </small>

            <strong id="selectedCount">
                0 / 8
            </strong>

        </div>


    </header>



    <!-- ===============================================
         MAIN CARD
    ================================================ -->

    <main class="card">


        <!-- TABLE HEADER -->

        <div class="table-header">

            <div>
                Kriter
            </div>

            <div class="number">
                1

            <div class="number">
                2
            </div>

            <div class="number">

            <div class="number">

        </div>

        <div id="questions">

        <!-- ===========================================
             RESULT

        <div class="result-area">


            <div class="metric">

                <small>

                </small>

                <strong id="totalScore">

            </span>

            <span>

            </span>

            <span>
                2.51 – 3.25 Large
            </span>

            <span>
                3.26 – 4.00 X-Large
            </span>

        </div>


    </main>


</div>



<script>


/* =====================================================
   CRITERIA
===================================================== */

const criteria = [


    {

        name:
            "Veri Karmaşıklığı",

        options: [

            "Veri Hazır",

            "Küçük veri hazırlığı",

            "Birden fazla kaynak",

            "Veri keşfi / veri kalitesi problemi"

        ]

    },


    {

        name:
            "İşin Kapsamı",

        options: [

            "Tek ve net bir ihtiyacı çözer",

            "Birden fazla alt aktivite içerir",

            "Bir iş akışının veya önemli bir yeteneğin geliştirilmesi",

            "Birden fazla iş alanını kapsar veya parçalanması düşünülmelidir"

        ]

    },


    {

        name:
            "Çözüm Karmaşıklığı",

        options: [

            "Bilinen çözüm paterni",

            "Kısmen analiz ve tasarım gerektirir",

            "Birden fazla teknik karar içerir",

            "Yüksek teknik ve iş karmaşıklığı"

        ]

    },


    {

        name:
            "Bağımlılık Seviyesi",

        options: [

            "Bağımlılık yok veya çok sınırlı",

            "Tek ekip, sistem veya vendor bağımlılığı",

            "Birden fazla ekip/sistem veya kritik vendor bağımlılığı",

            "Çok sayıda ekip, sistem ve/veya kritik vendor bağımlılığı vardır"

        ]

    },


    {

        name:
            "Risk & Belirsizlik",

        options: [

            "Çözüm ve ihtiyaç net",

            "Bazı bilinmezler bulunur",

            "Risk veya belirsizlik yüksektir",

            "Belirsizlik ve risk kritik seviyededir"

        ]

    },


    {

        name:
            "Etki Alanı",

        options: [

            "Tek sistem / tek domain",

            "Birden fazla bileşeni etkiler",

            "Birden fazla ürün / domain etkilenir",

            "Tribe genelinde veya geniş ekosistemde etki yaratır"

        ]

    },


    {

        name:
            "Paydaş / Koordinasyon İhtiyacı",

        options: [

            "Az sayıda paydaş",

            "Birkaç paydaş ile koordinasyon gerekir",

            "Düzenli koordinasyon gerekir",

            "Yoğun koordinasyon ve hizalanma gerekir"

        ]

    },


    {

        name:
            "Uzmanlık Çeşitliliği",

        options: [

            "Tek uzmanlık alanı",

            "2-3 uzmanlık alanı",

            "4 farklı uzmanlık alanı",

            "Dörtten fazla uzmanlık alanı ve paralel koordinasyon"

        ]

    }


];



/* =====================================================
   ANSWERS

   Her kriter başlangıçta 0 puan.

   Kullanıcı seçim yapmazsa
   kriter 0 olarak kalır.
===================================================== */

const answers =
    new Array(
        criteria.length
    ).fill(0);



/* =====================================================
   CREATE QUESTION TABLE
===================================================== */

const questionsContainer =
    document.getElementById(
        "questions"
    );



criteria.forEach(
    (criterion, rowIndex) => {


        const row =
            document.createElement(
                "div"
            );


        row.className =
            "question";



        /* -------------------------------------------
           QUESTION TITLE
        ------------------------------------------- */

        const title =
            document.createElement(
                "div"
            );


        title.className =
            "question-title";


        title.innerHTML = `

            <span class="question-number">

                ${String(
                    rowIndex + 1
                ).
